jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token:
    expiration-time: 600000

spring:
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 5s
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: validate
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
    mongodb:
      uri: ${MONGO_URI}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  profiles:
    active: dev
server:
  tomcat:
    max-http-form-post-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 5s
  port: ${SERVER_PORT}
cors:
  allowedOrigins: "${CORS_ALLOWED_ORIGINS}"
